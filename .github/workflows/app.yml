name: app-ci

# 앱 코드가 바뀔 때만 실행. analyze + test(라이브 feed 통합테스트 포함) + APK 빌드.
# 로컬(잠긴 회사PC)에 Android SDK가 없어서 APK 빌드/배포 검증은 여기서 한다.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (라이브 feed 통합 포함)
        run: flutter test

      - name: Build APK (release, debug-signed → 실기기 설치용)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeollim-allim-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
