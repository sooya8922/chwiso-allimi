name: poll-yeyak

# 하루 4회 수집 (yeyak 상태는 하루 1~2회 배치 갱신이라 충분 — 22.5h 실측 근거).
# KST 09:07 / 14:07 / 21:07(20:20 메인배치 직후) / 02:07. GH cron 지연/스킵 허용.
on:
  schedule:
    - cron: "7 0,5,12,17 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 제공

# 동시 실행 방지 (DB 충돌 방지)
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write   # 결과를 레포에 커밋하기 위해 필요

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll yeyak
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          CATEGORIES: education,culture   # 선착순 모집형만 (시설형 제외)
        run: python3 poller.py

      - name: Build feed.json
        run: python3 make_feed.py

      - name: Sanity check feed
        run: |
          python3 -c "import json; f=json.load(open('feed.json')); assert f['version']==1 and f['counts']['courses']>100, f['counts']; print('feed OK:', f['counts'])"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add chwiso.db transitions.jsonl feed.json
          git commit -m "poll $(date -u +%FT%TZ)" || echo "변화 없음 - 커밋 스킵"
          git push || echo "push 실패 (다음 회차에 재시도)"

